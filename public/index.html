<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="RetrieVIT - VIT Campus Lost and Found">
  <title>RetrieVIT</title>
  <script>
    (function () { try { var t = localStorage.getItem('retrievit_theme') || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); document.documentElement.setAttribute('data-theme', t); document.documentElement.classList.add(t); } catch (e) { } })();
  </script>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/pages.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>

<body>

  <!-- Immediate Gatekeeper Redirection -->
  <div
    style="min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #0b0f19; text-align: center; padding: var(--space-6);">
    <div>
      <h1
        style="font-family: var(--font-heading); font-size: 2.25rem; font-weight: 800; color: #ffffff; margin-bottom: 8px; letter-spacing: -0.02em;">
        Retrie<span style="color: #3b82f6;">VIT</span></h1>
      <div class="loading-spinner" style="margin: 0 auto 16px;"></div>
      <p class="text-secondary text-sm" style="color: #94a3b8;">Checking authentication status...</p>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <script src="js/utils.js"></script>
  <script src="js/firebase-config.js"></script>
</body>

</html>
